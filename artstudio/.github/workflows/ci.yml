name: CI Build, Lint & Instrumented Test Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Grant Execute Permission to Gradle Wrapper
        working-directory: artstudio
        run: chmod +x gradlew

      - name: Verify Art Fixtures Integrity
        working-directory: artstudio
        run: python3 tools/qa/verify_art_fixtures.py

      - name: Run Android Lint Check
        working-directory: artstudio
        run: ./gradlew lintDebug --no-daemon

      - name: Run Android Unit & Benchmark Tests
        working-directory: artstudio
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run E2E Golden QA Verification
        working-directory: artstudio
        run: python3 tools/qa/test_core_flows_e2e_goldens.py

      - name: Assemble Debug APK & Test APK
        working-directory: artstudio
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Run Instrumented Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          working-directory: artstudio
          script: ./gradlew connectedCheck --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug
          path: artstudio/app/build/outputs/apk/debug/app-debug.apk
